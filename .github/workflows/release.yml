# Semantic versioning and releases.
#
# release-please reads Conventional Commits since the last tag, keeps
# CHANGELOG.md and version.txt, and opens a release PR. Merging that PR tags
# the release and publishes it, which triggers publish-base.yml.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release PR, tag, and release
      pull-requests: write
      actions: write         # dispatch publish-base.yml
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Deliberately no release-type input: passing one puts the action in
          # simple-config mode, where release-please-config.json and the
          # manifest are ignored — which silently proposed 1.0.0 instead of
          # honouring the 0.1.0 in the manifest.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Publish the base image for this release
        # A release created with GITHUB_TOKEN does not emit a `release` event
        # that can start another workflow — GitHub suppresses that to prevent
        # loops. workflow_dispatch is the documented exception, so ask for the
        # publish explicitly rather than relying on a trigger that never fires.
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish-base.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
