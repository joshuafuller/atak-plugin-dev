# Proves the image still builds for somebody who is not us. Deliberately has
# no secrets and read-only permissions: a workflow is code, and a pull request
# that can change it must not be able to use it.
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the base image
        # Freely redistributable layers only; this is what gets published.
        run: docker build -f Dockerfile.base -t atak-plugin-dev-base:ci .

      - name: Build the full image on top of it
        # Adds the Android SDK, which is never published. No ATAK SDK is
        # needed: it is licensed material, mounted at runtime.
        run: docker build --build-arg BASE=atak-plugin-dev-base:ci -t atak-plugin-dev:ci .

      - name: The toolchain is what the README claims
        run: |
          docker run --rm atak-plugin-dev:ci bash -lc '
            set -e
            java -version 2>&1 | head -1
            test -d /opt/android-sdk/platforms/android-36
            test -d /opt/android-sdk/platforms/android-34
            test -d /opt/android-sdk/build-tools/36.0.0
            command -v adb >/dev/null
            command -v gh  >/dev/null
            command -v rg  >/dev/null
            command -v trivy    >/dev/null
            command -v gitleaks >/dev/null
            echo "toolchain ok"
          '

      - name: doctor asks for the SDK rather than failing obscurely
        # With no SDK mounted, the first check must fail with the instruction
        # to obtain one. This is the first thing a new user sees.
        run: |
          out=$(docker run --rm -v "$PWD/workspace/bin:/opt/tak-bin:ro" \
                  atak-plugin-dev:ci /opt/tak-bin/doctor 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "no SDK mounted" \
            || { echo "::error::doctor did not report the missing SDK clearly"; exit 1; }
          echo "$out" | grep -q "tak.gov" \
            || { echo "::error::doctor did not say where to get the SDK"; exit 1; }

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck the helper scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning workspace/bin/deploy workspace/bin/instrument \
                                workspace/bin/doctor workspace/bin/scan \
                                bin/host-adb-server

      - name: Compose file is valid
        run: |
          # Substituted so validation does not depend on a local .env.
          ATAK_SDK_DIR=/tmp/sdk PLUGINS_DIR=/tmp/plugins \
            docker compose config >/dev/null
          echo "compose ok"

      - name: No ATAK SDK material, in the working tree or in history
        run: |
          # Checking only the working tree is what let an SDK archive sit in
          # this repository's published history for a day: it had been deleted
          # in a later commit, so `git ls-files` was clean while the blob was
          # still fetchable from the public remote. History is what gets
          # published, so history is what gets checked.
          #
          # Still a backstop, not a proof: it cannot recognise an SDK text file
          # that has been renamed. NOTICE.md says so rather than claiming more.
          banned='\.(aar|apk|aab|jar|zip|keystore|so)$|android_keystore|atak-gradle-takdev|atakplugintests|ATAKPluginTests|plugintemplate|(^|/)main\.jar$'

          if git ls-files | grep -qiE "$banned"; then
            echo "::error::SDK material or a binary artifact is in the working tree"
            git ls-files | grep -iE "$banned"
            exit 1
          fi

          # Every path that has ever existed on any ref.
          if git rev-list --objects --all \
             | git cat-file --batch-check='%(objecttype) %(objectname) %(rest)' \
             | awk '$1=="blob" {$1=""; $2=""; print substr($0,3)}' \
             | grep -qiE "$banned"; then
            echo "::error::SDK material exists in history, even if deleted since"
            git rev-list --objects --all \
              | git cat-file --batch-check='%(objecttype) %(objectname) %(rest)' \
              | awk '$1=="blob" {$1=""; $2=""; print substr($0,3)}' \
              | grep -iE "$banned" | sort -u
            exit 1
          fi
          echo "clean, working tree and history"
