# Publish the base image.
#
# Only the *base* is published: the JDK, Gradle, the scanners and the shell
# tooling, all freely redistributable. The Android SDK is added by the final
# stage on the user's own machine, because Google's Android SDK Terms 3.4
# forbid redistributing it. See docs/WHAT-SHIPS.md.
#
# Triggered by a published release, and manually, so a failed publish can be
# retried without cutting a new version.
name: publish-base

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  base-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # provenance and SBOM attestation need an OIDC token
    steps:
      - name: Work out the version
        id: v
        env:
          RAW: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Strip the leading v; refuse anything that is not semver, so a typo
          # in a manual dispatch cannot publish a nonsense tag.
          V="${RAW#v}"
          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$RAW' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          echo "full=$V"        >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}"  >> "$GITHUB_OUTPUT"
          echo "major=${V%%.*}" >> "$GITHUB_OUTPUT"
          # Normalised, so checkout never depends on whether the dispatcher
          # typed the leading v.
          echo "ref=v$V"        >> "$GITHUB_OUTPUT"

          # Moving tags must never go backwards. Retrying an old release after
          # a newer one exists would otherwise point :latest at the older
          # image.
          # Fail closed. If the lookup does not work we do not know whether
          # this is the newest release, and moving :latest on a guess is the
          # exact failure this check exists to prevent. Publishing the precise
          # version is always safe.
          if NEWEST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                        --json tagName -q '.[0].tagName') && [ -n "$NEWEST" ]; then
            if [ "v$V" = "$NEWEST" ]; then
              echo "moving=true" >> "$GITHUB_OUTPUT"
            else
              echo "moving=false" >> "$GITHUB_OUTPUT"
              echo "::notice::v$V is not the newest release ($NEWEST); publishing the exact version only"
            fi
          else
            echo "moving=false" >> "$GITHUB_OUTPUT"
            echo "::warning::could not determine the newest release; publishing the exact version only"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.ref }}

      # Attestations need the container driver; the default docker driver
      # cannot produce them and the build fails outright.
      - uses: docker/setup-buildx-action@v3
        with:
          # Explicit: the default docker driver cannot produce attestations,
          # and a runner default change would silently break publishing.
          driver: docker-container

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out which tags to move
        id: tags
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/atak-plugin-dev-base
          FULL: ${{ steps.v.outputs.full }}
          MINOR: ${{ steps.v.outputs.minor }}
          MAJOR: ${{ steps.v.outputs.major }}
          MOVING: ${{ steps.v.outputs.moving }}
        run: |
          {
            echo "list<<EOF"
            echo "$REPO:$FULL"
            if [ "$MOVING" = "true" ]; then
              echo "$REPO:$MINOR"
              echo "$REPO:$MAJOR"
              echo "$REPO:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          # An immutable tag for builds that must still work next year, and
          # moving tags for people who want the newest.
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.full }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Base layer for the ATAK plugin dev container. Contains no Android SDK and no ATAK SDK.
          provenance: true
          sbom: true

      - name: Scan what was published
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/atak-plugin-dev-base:${{ steps.v.outputs.full }}
        run: |
          docker run --rm aquasec/trivy:0.73.0 image \
            --severity HIGH,CRITICAL --no-progress --exit-code 0 "$IMAGE"
