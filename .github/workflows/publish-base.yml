# Publish the base image.
#
# Only the *base* is published: the JDK, Gradle, the scanners and the shell
# tooling, all freely redistributable. The Android SDK is added by the final
# stage on the user's own machine, because Google's Android SDK Terms 3.4
# forbid redistributing it. See docs/WHAT-SHIPS.md.
#
# Triggered by a published release, and manually, so a failed publish can be
# retried without cutting a new version.
name: publish-base

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  base-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Work out the version
        id: v
        env:
          RAW: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # Strip the leading v; refuse anything that is not semver, so a typo
          # in a manual dispatch cannot publish a nonsense tag.
          V="${RAW#v}"
          if ! printf '%s' "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$RAW' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          echo "full=$V"                        >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}"                  >> "$GITHUB_OUTPUT"
          echo "major=${V%%.*}"                 >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # Attestations need the container driver; the default docker driver
      # cannot produce them and the build fails outright.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          # An immutable tag for builds that must still work next year, and
          # moving tags for people who want the newest.
          tags: |
            ghcr.io/${{ github.repository_owner }}/atak-plugin-dev-base:${{ steps.v.outputs.full }}
            ghcr.io/${{ github.repository_owner }}/atak-plugin-dev-base:${{ steps.v.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/atak-plugin-dev-base:${{ steps.v.outputs.major }}
            ghcr.io/${{ github.repository_owner }}/atak-plugin-dev-base:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.full }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Base layer for the ATAK plugin dev container. Contains no Android SDK and no ATAK SDK.
          provenance: true
          sbom: true

      - name: Scan what was published
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/atak-plugin-dev-base:${{ steps.v.outputs.full }}
        run: |
          docker run --rm aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --no-progress --exit-code 0 "$IMAGE"
